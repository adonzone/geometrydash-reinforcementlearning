name: Build Geode Mod & Run RL Tests

on:
  workflow_dispatch:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "main"

jobs:
  test-rl-engine:
    name: C++23 RL Engine Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure & Build Tests
        run: |
          cmake -B build-tests -DGDAI_BUILD_TESTS=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build-tests --parallel
      - name: Run Unit & Training Convergence Tests
        run: ./build-tests/gdai_tests

  build:
    needs: [test-rl-engine]
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: Windows
            os: windows-latest
            target: Win64
          - name: macOS
            os: macos-latest
            target: MacOS
          - name: iOS
            os: macos-latest
            target: iOS
          - name: Android32
            os: ubuntu-latest
            target: Android32
          - name: Android64
            os: ubuntu-latest
            target: Android64

    name: Build (${{ matrix.config.name }})
    runs-on: ${{ matrix.config.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Build the Geode mod
        uses: geode-sdk/build-geode-mod@main
        with:
          combine: true
          target: ${{ matrix.config.target }}

  package:
    name: Package Multi-Platform .geode
    needs: [build]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Combine platform builds
        uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - name: Upload .geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: GD-AI-RL-Master
          path: ${{ steps.build.outputs.build-output }}
